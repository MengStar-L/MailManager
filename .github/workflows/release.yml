name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must have the form vX.Y.Z without leading zeroes" >&2
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run Go tests
        run: go test ./...

      - name: Validate Linux deployment scripts
        shell: bash
        run: |
          sh -n scripts/install-linux.sh scripts/install-linux_test.sh scripts/build-release.sh
          sh scripts/install-linux_test.sh
          shellcheck scripts/install-linux.sh scripts/install-linux_test.sh scripts/build-release.sh

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Run frontend tests
        run: npm test --prefix web -- --reporter=dot

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: web
        env:
          PLAYWRIGHT_PORT: "4176"
        run: npm run test:e2e

      - name: Build release assets
        env:
          SKIP_NPM_CI: "1"
        run: sh scripts/build-release.sh

      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check checksums.txt

      - name: Verify systemd templates
        shell: bash
        run: |
          root=$(mktemp -d /tmp/mailmanager-systemd.XXXXXX)
          trap 'rm -rf -- "$root"' EXIT
          install -d "$root/bin" "$root/config" "$root/data" "$root/updater/inbox"
          install -m 0755 /bin/true "$root/bin/mailmanager"
          install -m 0644 deploy/mailmanager.env.example "$root/config/mailmanager.env"
          sed "s|/opt/mailmanager|$root|g" deploy/mailmanager.service > "$root/mailmanager.service"
          sed "s|/opt/mailmanager|$root|g" deploy/mailmanager-updater.service > "$root/mailmanager-updater.service"
          sed "s|/opt/mailmanager|$root|g" deploy/mailmanager-updater.path > "$root/mailmanager-updater.path"
          systemd-analyze verify "$root/mailmanager.service" "$root/mailmanager-updater.service" "$root/mailmanager-updater.path"

      - name: Verify native release version
        shell: bash
        run: |
          chmod 0755 dist/mailmanager-linux-amd64
          actual_version=$(
            dist/mailmanager-linux-amd64 version --json |
              node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(value.version)'
          )
          test "$actual_version" = "$VERSION"

      - name: Smoke test Linux installation
        shell: bash
        run: |
          set -euo pipefail
          install_root=/opt/mailmanager-smoke
          server_pid=
          cleanup() {
            sudo systemctl disable --now mailmanager-updater.path mailmanager.service >/dev/null 2>&1 || true
            sudo rm -f /etc/systemd/system/mailmanager.service \
              /etc/systemd/system/mailmanager-updater.service \
              /etc/systemd/system/mailmanager-updater.path \
              /usr/local/bin/mailmanager
            sudo rm -rf -- "$install_root"
            sudo systemctl daemon-reload
            if [ -n "$server_pid" ]; then kill "$server_pid" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT

          python3 -m http.server 18080 --bind 127.0.0.1 --directory dist >/tmp/mailmanager-assets.log 2>&1 &
          server_pid=$!
          for _ in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:18080/checksums.txt >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18080/checksums.txt >/dev/null

          sed \
            -e '/^RELEASE_URL=/c\RELEASE_URL="http://127.0.0.1:18080"' \
            -e "s/--proto '=https'/--proto '=http,https'/g" \
            scripts/install-linux.sh > /tmp/install-mailmanager-smoke.sh
          sudo sh /tmp/install-mailmanager-smoke.sh \
            --version "$GITHUB_REF_NAME" \
            --install-dir "$install_root" \
            --public-url https://mail.example.com \
            --yes

          set -x
          systemctl is-active --quiet mailmanager.service
          systemctl is-active --quiet mailmanager-updater.path
          curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null
          test -s "$install_root/data/bootstrap-token"
          test "$(stat -c '%U:%G %a' "$install_root/config")" = 'root:mailmanager 750'
          test "$(stat -c '%U:%G %a' "$install_root/config/mailmanager.env")" = 'root:mailmanager 640'
          test "$(stat -c '%U:%G %a' "$install_root/config/master.key")" = 'mailmanager:mailmanager 600'
          test "$(stat -c '%U:%G %a' "$install_root/data")" = 'mailmanager:mailmanager 700'
          test "$(stat -c '%U:%G %a' "$install_root/updater")" = 'root:mailmanager 2750'
          grep -F "ExecStart=$install_root/bin/mailmanager serve" /etc/systemd/system/mailmanager.service
          grep -F 'server_name mail.example.com;' "$install_root/config/nginx.conf.example"

      - name: Pack release artifact
        run: tar -C dist -czf release-assets.tar.gz .

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: artifact

      - name: Extract and verify release assets
        shell: bash
        run: |
          mkdir dist
          tar -xzf artifact/release-assets.tar.gz -C dist
          cd dist
          sha256sum --check checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "MailManager $GITHUB_REF_NAME"
